name: One-time membership script repair

on:
  push:
    paths:
      - ".github/workflows/one-time-membership-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair script placement
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "<script>\n/* LIFEPASS membership + passport quota */"
          a = s.find(marker)
          if a < 0:
              raise SystemExit("membership script not found")
          b = s.find("</script>", a)
          if b < 0:
              raise SystemExit("membership script end not found")
          b += len("</script>")
          block = s[a:b]
          s = s[:a] + s[b:]
          pos = s.rfind("</body>")
          if pos < 0:
              raise SystemExit("document body not found")
          s = s[:pos] + block + "\n" + s[pos:]
          p.write_text(s, encoding="utf-8")
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair membership script placement"
          git push
