name: One-time LIFEPASS startup upgrade

on:
  push:
    paths:
      - ".github/workflows/one-time-membership-repair.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade pricing and add startup features
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_plans = """  const PLANS={
    free:{name:'Free',price:0,limit:10},
    regular:{name:'Regular',price:99,limit:100},
    pro:{name:'Pro',price:249,limit:500},
    business:{name:'Business',price:499,limit:2000}
  };"""
          new_plans = """  const PLANS={
    free:{name:'Free',price:0,limit:10},
    startup:{name:'Startup',price:29,limit:25},
    regular:{name:'Regular',price:79,limit:100},
    pro:{name:'Pro',price:199,limit:500},
    business:{name:'Business',price:399,limit:2000}
  };"""
          if old_plans not in s:
              raise SystemExit("membership plan block not found")
          s = s.replace(old_plans, new_plans, 1)

          start = s.find("<!-- MEMBERSHIP PAGE -->")
          end = s.find("<!-- CREATE MODAL -->", start)
          if start < 0 or end < 0:
              raise SystemExit("membership page boundaries not found")

          membership_html = """<!-- MEMBERSHIP PAGE -->
<section id="page-membership" class="page">
  <div class="lp-membership-wrap">
    <div class="lp-membership-hero">
      <div>
        <span class="lp-membership-badge" id="membershipStatusBadge">FREE MEMBERSHIP</span>
        <h2>Startup-friendly LIFEPASS plans</h2>
        <p>Start tiny, grow when your product collection grows. Low-cost plans include the tools that make a digital passport useful from day one.</p>
      </div>
      <button class="btn" style="background:#fff;color:#102f50" onclick="showPage('dashboard')">Back to Dashboard</button>
    </div>
    <div class="lp-membership-summary" id="membershipSummary"></div>
    <div class="title" style="text-align:left;margin-bottom:18px">
      <h2>Simple pricing for founders & small businesses</h2>
      <p>No expensive entry plan. Upgrade only when you actually need more passports.</p>
    </div>
    <div class="lp-plan-grid">
      <article class="lp-plan">
        <h3>Free</h3><div class="lp-price">₹0 <small>/ month</small></div>
        <ul><li>10 passports</li><li>Digital product history</li><li>QR & public passport</li><li>Basic verification</li><li>Mobile PWA access</li></ul>
        <button class="btn outline" onclick="selectMembershipPlan('free')">Current / Free</button>
      </article>
      <article class="lp-plan featured">
        <span class="popular">STARTUP · ₹29</span><h3>Startup</h3><div class="lp-price">₹29 <small>/ month</small></div>
        <ul><li>25 passports</li><li>Everything in Free</li><li>Warranty alerts</li><li>CSV / JSON export</li><li>Shareable passport links</li><li>Duplicate passport</li><li>Service & ownership history</li></ul>
        <button class="btn primary" onclick="selectMembershipPlan('startup')">Choose Startup</button>
      </article>
      <article class="lp-plan">
        <span class="popular">MOST POPULAR</span><h3>Regular</h3><div class="lp-price">₹79 <small>/ month</small></div>
        <ul><li>100 passports</li><li>Everything in Startup</li><li>Advanced verification</li><li>Marketplace & price insights</li><li>Product value analysis</li><li>Notifications & security tools</li><li>Priority feature access</li></ul>
        <button class="btn primary" onclick="selectMembershipPlan('regular')">Choose Regular</button>
      </article>
      <article class="lp-plan">
        <h3>Pro</h3><div class="lp-price">₹199 <small>/ month</small></div>
        <ul><li>500 passports</li><li>Everything in Regular</li><li>AI assistance</li><li>Advanced analytics</li><li>Document & evidence tools</li><li>Ownership transfer workflows</li><li>Priority support</li></ul>
        <button class="btn primary" onclick="selectMembershipPlan('pro')">Choose Pro</button>
      </article>
      <article class="lp-plan">
        <h3>Business</h3><div class="lp-price">₹399 <small>/ month</small></div>
        <ul><li>2,000 passports</li><li>Everything in Pro</li><li>Team-ready capacity</li><li>Business product management</li><li>High-volume workflows</li><li>Founder-friendly scale pricing</li><li>Future API / integration access</li></ul>
        <button class="btn primary" onclick="selectMembershipPlan('business')">Choose Business</button>
      </article>
    </div>
    <div class="lp-feature-grid" style="margin-top:22px">
      <div class="lp-feature-card"><h3>🚀 Built for startups</h3><p>Launch with ₹29/month instead of forcing a new business into a high subscription bill.</p></div>
      <div class="lp-feature-card"><h3>📦 Product lifecycle</h3><p>Track purchase, warranty, service, verification, ownership, resale and product value in one passport.</p></div>
      <div class="lp-feature-card"><h3>📤 Take your data with you</h3><p>Export your passport collection as JSON or CSV and keep your business records portable.</p></div>
      <div class="lp-feature-card"><h3>🔗 Share & verify</h3><p>Share public passport links and QR codes so buyers can check product information quickly.</p></div>
      <div class="lp-feature-card"><h3>🛡️ Trust tools</h3><p>Verification requests, evidence, ownership transfer, password protection and account security tools.</p></div>
      <div class="lp-feature-card"><h3>🤖 Smart tools</h3><p>AI assistance, price insight, value analysis, notifications and analytics are already part of the LIFEPASS roadmap.</p></div>
    </div>
    <div class="lp-membership-note">Startup pricing is intentionally low for early users. Payments are not activated yet; paid plan selection currently prepares an activation request until a live payment provider or Google Play Billing is connected.</div>
  </div>
</section>

"""
          s = s[:start] + membership_html + s[end:]

          search_old = '<input id="searchPassport" class="profile-input" style="flex:1;min-width:220px" placeholder="Search passports..." oninput="renderPassports()">'
          search_new = search_old + '<button class="btn outline" onclick="exportPassports(\'csv\')">Export CSV</button><button class="btn outline" onclick="exportPassports(\'json\')">Export JSON</button><button class="btn outline" onclick="showWarrantyAlerts()">Warranty Alerts</button>'
          if search_old not in s:
              raise SystemExit("passport search toolbar not found")
          s = s.replace(search_old, search_new, 1)

          pid = r"$" + "{p.id}"
          view_button = '<button class="btn secondary"\n   onclick="viewPassport(\'__PID__\')">View</button>'.replace("__PID__", pid)
          view_replacement = view_button + '\n\n   <button class="btn outline" onclick="sharePassport(\'__PID__\')">Share</button>\n\n   <button class="btn outline" onclick="duplicatePassport(\'__PID__\')">Duplicate</button>'
          view_replacement = view_replacement.replace("__PID__", pid)
          if view_button not in s:
              raise SystemExit("passport action button not found")
          s = s.replace(view_button, view_replacement, 1)

          marker = "<script>\n/* LIFEPASS membership + passport quota */"
          m = s.find(marker)
          if m < 0:
              raise SystemExit("membership script marker not found")

          feature_script = """<script>
/* LIFEPASS startup utilities: export, share, duplicate, warranty alerts */
(function(){
  function csvCell(v){
    const x=String(v??'').replace(/"/g,'""');
    return '"' + x + '"';
  }
  window.exportPassports=function(format){
    if(!window.currentUser){toast('Please log in first.');showPage('login');return;}
    const rows=Array.isArray(window.passports)?window.passports:[];
    if(!rows.length){toast('No passports to export yet.');return;}
    const stamp=new Date().toISOString().slice(0,10);
    let blob,name;
    if(format==='csv'){
      const keys=['id','productName','productType','brand','model','serialNumber','purchaseDate','warrantyDate','purchasePrice','productCondition','ownerName','ownerEmail','status','createdAt','updatedAt'];
      const csv=[keys.join(','),...rows.map(p=>keys.map(k=>csvCell(p[k])).join(','))].join('\n');
      blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); name='lifepass-passports-'+stamp+'.csv';
    }else{
      blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}); name='lifepass-passports-'+stamp+'.json';
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); toast('Export ready: '+name);
  };
  window.sharePassport=async function(id){
    const p=(window.passports||[]).find(x=>x.id===id); if(!p){toast('Passport not found.');return;}
    const url=publicUrl(p), text='LIFEPASS · '+(p.productName||'Product')+' · '+p.id;
    try{if(navigator.share) await navigator.share({title:'LIFEPASS Passport',text,url}); else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('Passport link copied.');} else window.prompt('Copy this LIFEPASS passport link:',url);}
    catch(e){if(e?.name!=='AbortError')toast('Could not share the passport link.');}
  };
  window.duplicatePassport=async function(id){
    if(!window.currentUser){toast('Please log in first.');showPage('login');return;}
    const source=(window.passports||[]).find(x=>x.id===id); if(!source){toast('Passport not found.');return;}
    const ok=window.canCreatePassport ? await window.canCreatePassport() : true; if(!ok)return;
    const copy=JSON.parse(JSON.stringify(source)); copy.id=generateId(); copy.status='Pending'; copy.verificationRequested=false; copy.verificationAdminNote=''; copy.pendingTransfer=null; copy.transferStatus=null; copy.createdAt=new Date().toISOString(); copy.updatedAt=new Date().toISOString(); copy.productName=(source.productName||'Product')+' Copy';
    window.passports.unshift(copy); savePassports(); renderPassports(); updateDashboard(); toast('Passport duplicated: '+copy.id);
  };
  window.showWarrantyAlerts=function(){
    if(!window.currentUser){toast('Please log in first.');showPage('login');return;}
    const now=new Date(), soon=new Date(now.getTime()+30*86400000);
    const items=(window.passports||[]).filter(p=>p.warrantyDate).map(p=>({p,d:new Date(p.warrantyDate)})).filter(x=>!isNaN(x.d)&&x.d<=soon).sort((a,b)=>a.d-b.d);
    if(!items.length){toast('No warranties are expiring in the next 30 days.');return;}
    const lines=items.slice(0,12).map(x=>(x.d<now?'• '+(x.p.productName||'Product')+' — EXPIRED':'• '+(x.p.productName||'Product')+' — expires '+x.d.toLocaleDateString()));
    alert('LIFEPASS Warranty Alerts\\n\\n'+lines.join('\\n')+(items.length>12?'\\n\\n+'+(items.length-12)+' more':''));
  };
})();
</script>

"""
          s = s[:m] + feature_script + s[m:]
          p.write_text(s,encoding="utf-8")

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-membership-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-membership-repair.yml
          git commit -m "Lower startup pricing and add passport tools"
          git push
