name: LIFEPASS Google Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - closed
          - production

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run mobile:prepare
      - name: Add Android platform
        run: npx cap add android
      - name: Generate Android app assets
        run: |
          mkdir -p assets
          cp logo.png assets/logo.png
          npx @capacitor/assets generate --android --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff"
      - name: Enforce Google Play API 36 target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/variables.gradle")
          s = p.read_text()
          s = re.sub(r'compileSdkVersion\\s*=\\s*\\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\\s*=\\s*\\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Sign release AAB
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifepass-google-play-aab
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lifepass.digital
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tracks: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
