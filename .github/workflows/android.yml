name: Build LIFEPASS Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run mobile:prepare

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app assets
        run: |
          mkdir -p assets
          cp logo.png assets/logo.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Enforce Google Play API 36 target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/variables.gradle")
          s = p.read_text()
          s = re.sub(r'compileSdkVersion\\s*=\\s*\\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\\s*=\\s*\\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifepass-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
