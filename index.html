<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LIFEPASS – Digital Product Passport</title>

  <meta
    name="description"
    content="LIFEPASS is a digital product passport platform that gives products a secure digital identity and keeps their complete history."
  >

  <meta
    name="theme-color"
    content="#102f50"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    href="./logo.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8fc;
      color: #102f50;
    }

    header {
      background: #102f50;
      color: white;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-area img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    main {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
      background: white;
      border-radius: 20px;
      padding: 50px 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .hero-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 42px;
      color: #102f50;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #526579;
      margin: 0 auto 30px;
      max-width: 650px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn.primary {
      background: #102f50;
      color: white;
    }

    .btn.primary:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .btn.secondary {
      background: #e8eef5;
      color: #102f50;
    }

    #installLifepassBtn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status {
      margin-top: 25px;
      font-size: 14px;
      color: #6b7c8f;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .container {
        padding: 40px 20px;
      }

      .btn {
        width: 100%;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo-area">

      <img
        src="./logo.png"
        alt="LIFEPASS Logo"
      >

      <span>LIFEPASS</span>

    </div>

  </header>


  <main>

    <div class="container">

      <img
        class="hero-logo"
        src="./logo.png"
        alt="LIFEPASS"
      >

      <h1>
        LIFEPASS
      </h1>

      <p>
        Your digital product passport for product identity,
        ownership, warranty, service history and verification.
      </p>


      <div class="actions">

        <button
          id="installLifepassBtn"
          class="btn primary"
          type="button"
          onclick="installLifepass()"
        >
          📲 Install LIFEPASS
        </button>

        <button
          class="btn secondary"
          type="button"
          onclick="openLifepass()"
        >
          Continue to LIFEPASS
        </button>

      </div>


      <div
        id="installStatus"
        class="status"
      >
        LIFEPASS is ready.
      </div>

    </div>

  </main>


  <script>

    /* =====================================================
       LIFEPASS PWA INSTALL SYSTEM
       ===================================================== */

    let lifepassInstallPrompt = null;


    /* -----------------------------------------------------
       Detect PWA installation availability
       ----------------------------------------------------- */

    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();

        lifepassInstallPrompt = event;

        const button =
          document.getElementById(
            "installLifepassBtn"
          );

        const status =
          document.getElementById(
            "installStatus"
          );


        if (button) {
          button.style.display = "inline-flex";
        }


        if (status) {
          status.textContent =
            "LIFEPASS is ready to install.";
        }

      }
    );


    /* -----------------------------------------------------
       Install LIFEPASS
       ----------------------------------------------------- */

    window.installLifepass =
      async function() {

        const button =
          document.getElementById(
            "installLifepassBtn"
          );

        const status =
          document.getElementById(
            "installStatus"
          );


        /* Chrome / Edge / Android */

        if (lifepassInstallPrompt) {

          try {

            lifepassInstallPrompt.prompt();

            const result =
              await lifepassInstallPrompt.userChoice;


            console.log(
              "LIFEPASS installation:",
              result.outcome
            );


            if (
              result.outcome === "accepted"
            ) {

              if (status) {
                status.textContent =
                  "LIFEPASS installation started.";
              }

              if (button) {
                button.style.display =
                  "none";
              }

            } else {

              if (status) {
                status.textContent =
                  "Installation was cancelled.";
              }

            }


            lifepassInstallPrompt = null;

          } catch (error) {

            console.error(
              "Installation error:",
              error
            );

          }

          return;
        }


        /* -------------------------------------------------
           Check whether already installed
           ------------------------------------------------- */

        const standalone =
          window.matchMedia(
            "(display-mode: standalone)"
          ).matches ||
          window.navigator.standalone === true;


        if (standalone) {

          alert(
            "LIFEPASS is already installed on this device."
          );

          return;
        }


        /* -------------------------------------------------
           iPhone / iPad
           ------------------------------------------------- */

        const isIOS =
          /iphone|ipad|ipod/i.test(
            navigator.userAgent
          ) ||
          (
            navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1
          );


        if (isIOS) {

          alert(
            "To install LIFEPASS on iPhone/iPad:\n\n" +
            "1. Open LIFEPASS in Safari.\n" +
            "2. Tap the Share button.\n" +
            "3. Select 'Add to Home Screen'.\n" +
            "4. Tap 'Add'."
          );

          return;
        }


        /* -------------------------------------------------
           Other browsers
           ------------------------------------------------- */

        alert(
          "LIFEPASS can be installed from your browser.\n\n" +
          "Open the browser menu and select:\n" +
          "'Install LIFEPASS'\n" +
          "or\n" +
          "'Add to Home screen'."
        );

      };


    /* -----------------------------------------------------
       Detect successful installation
       ----------------------------------------------------- */

    window.addEventListener(
      "appinstalled",
      function() {

        console.log(
          "LIFEPASS installed successfully."
        );


        lifepassInstallPrompt = null;


        const button =
          document.getElementById(
            "installLifepassBtn"
          );

        const status =
          document.getElementById(
            "installStatus"
          );


        if (button) {
          button.style.display = "none";
        }


        if (status) {
          status.textContent =
            "LIFEPASS is installed successfully.";
        }

      }
    );


    /* -----------------------------------------------------
       Continue button
       ----------------------------------------------------- */

    function openLifepass() {

      window.location.href =
        "./";

    }


  </script>

</body>
</html>
